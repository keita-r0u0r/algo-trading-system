[project]
name = "jqbt"
version = "0.1.0"
description = "国内株と FX の売買ルールの検証と、少額運用のための環境（研究用）"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8", "duckdb>=1.0", "jupyter"]
# 運用の操作盤（scripts/gui.py）
gui = ["streamlit>=1.40"]
# 秘密情報を GCP Secret Manager から読む（docs/secrets.md）
gcp = ["google-cloud-secret-manager>=2.20"]
# 拡張パーツ: AI（Claude）。JQBT_EXTENSIONS=ai で有効にする（docs/ai.md）
ai = ["anthropic>=1.15"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
