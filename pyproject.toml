[project]
name = "jqbt"
version = "0.1.0"
description = "国内株のバックテスト環境（研究用）"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8", "duckdb>=1.0", "jupyter"]
# 運用の操作盤（scripts/gui.py）
gui = ["streamlit>=1.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
